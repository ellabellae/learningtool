[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learningtool"
version = "0.1.0"
description = "Turn a research-paper PDF into a story-shaped interactive lesson."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.17",
  "anthropic>=0.40",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
learn = "learningtool.cli:main"

[tool.setuptools.packages.find]
include = ["learningtool*"]

[tool.setuptools.package-data]
learningtool = ["player/*", "prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "eval: real LLM calls; opt-in with `pytest -m eval`",
  "e2e: drives lesson.html in a headless browser",
]
addopts = "-m 'not eval'"
